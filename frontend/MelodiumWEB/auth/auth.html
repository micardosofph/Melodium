<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melodium | Diário de Bordo</title>
    <link rel="stylesheet" href="../global/style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="headerSafeArea" aria-hidden="true"></div>
    <div class="headerOverlay" aria-hidden="true"></div>
    <div id="header-placeholder"></div>

    <main class="auth-shell">
      <section class="auth-card border-main" aria-labelledby="auth-title">
        <div class="auth-intro">
          <p class="eyebrow">Melodium TCC 2026</p>
          <h1 id="auth-title">Cadastre-se e deixe seu nome marcado no Melodium.</h1>
          <p class="auth-copy">Deixe o seu nome para testar a plataforma e simular a criação do seu perfil de estudante de música.</p>
        </div>

        <form class="auth-form active" id="signupForm" novalidate style="display: grid;">
          <label for="userNameInput">
            Nome ou Apelido
            <input id="userNameInput" name="name" type="text" placeholder="Seu nome" required />
          </label>
          <label for="signupEmailInput">
            E-mail (Pode ser fictício)
            <input id="signupEmailInput" name="email" type="email" placeholder="visitante@feira.com" required />
          </label>
          
          <button class="btn-signup border-main" type="submit">Iniciar Teste</button>
        </form>
      </section>
    </main>

    <div id="modalSucesso" class="modal-em-breve-overlay">
        <div class="modal-em-breve-content border-main">
            <h3 style="margin-top: 0; color: #333;">Tudo pronto! </h3>
            <p id="mensagemSucessoModal">Bem-vindo à demonstração!</p>
            <button onclick="continuarParaSite()" class="btn-fechar-modal">Entrar no Site</button>
        </div>
    </div>

    <script src="../global/header.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
